<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Authenticity Report</h2>
    <div id="loading">Analyzing image...</div>
    <div id="results" class="hidden">
      <div class="score-card">
        <span>Confidence Score:</span>
        <span id="score">--</span>
      </div>
      <ul class="details">
        <li>AI Likelihood: <strong id="ai-prob">--</strong></li>
        <li>C2PA Signature: <strong id="c2pa">--</strong></li>
        <li>Metadata: <strong id="metadata">--</strong></li>
      </ul>
      <p id="verdict"></p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
